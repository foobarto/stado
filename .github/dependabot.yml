# Dependabot configuration.
#
# Goals:
#   1. Trigger explicit security-update + version-bump PRs against
#      the parent module (bundled plugins share its go.mod).
#   2. Force a rescan on every push to one of these manifests so
#      alerts auto-flip to "fixed" promptly after a fix lands.
#
# Bundled plugins under plugins/bundled/* share the parent module's
# go.mod and are covered by the parent entry. Optional/demo plugins
# moved to github.com/foobarto/stado-plugins (EP-0042) and are tracked
# by that repo's own dependabot config.
#
# `groups` bundles every matching update per ecosystem into ONE PR per
# run (patterns: "*"), instead of one PR per dependency — so a weekly
# gomod run and a monthly actions run each produce a single combined PR.
# This includes major bumps; if one breaks, the grouped PR's CI fails and
# the whole group waits together, which is the intended "review them as a
# set" tradeoff.

version: 2

updates:
  # Parent module.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      go-dependencies:
        patterns:
          - "*"

  # GitHub Actions used in CI workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(ci)"
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
