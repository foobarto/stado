name: Release

# Triggered by vX.Y.Z tags. Produces:
#   1. Cross-platform binaries (linux/darwin/windows × amd64/arm64) via
#      goreleaser, with checksums.txt and SBOM per-archive.
#   2. Cosign keyless signature over checksums.txt (sig + cert uploaded
#      alongside). Rekor transparency-log entry is implicit with cosign ≥ 2.
#   3. SLSA-L3 build provenance attestation over every released artifact
#      via GitHub-native actions/attest-build-provenance. (Replaced the
#      slsa-framework/slsa-github-generator reusable workflow, which is
#      tag-pinned internally and so was rejected by this repo's
#      sha_pinning_required Actions policy — it never produced provenance.
#      The native action is SHA-pinnable and verifiable with
#      `gh attestation verify <artifact> --repo foobarto/stado`.)
#
# Reproducibility is enforced by -trimpath + -buildvcs=true + pinned
# mod_timestamp in .goreleaser.yaml. A third-party rebuild at the same
# commit sha must produce identical sha256 (see `stado verify`).
on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Least privilege at the top; the release job opts into the writes it
# needs below (Scorecard Token-Permissions).
permissions:
  contents: read

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload release artifacts
      packages: write      # publish to GHCR (Homebrew tap push comes later)
      id-token: write      # OIDC for cosign keyless + provenance signing
      attestations: write  # write build-provenance attestations
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.26.3"
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo PAT for publishing the Homebrew formula to
          # foobarto/homebrew-tap. The default GITHUB_TOKEN only has
          # write scope on the current repo, so the tap PR needs a
          # PAT provisioned as HOMEBREW_TAP_TOKEN. .goreleaser.yaml
          # templates skip_upload=true when this secret is unset, so
          # the release still succeeds — just without the tap PR.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Attest build provenance
        # GitHub-native SLSA-L3 provenance over every released artifact.
        # subject-checksums reads goreleaser's checksums.txt (the same file
        # cosign signs), so one attestation covers all archives + binaries.
        # SHA-pinned to satisfy the repo's sha_pinning_required policy.
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-checksums: dist/checksums.txt
