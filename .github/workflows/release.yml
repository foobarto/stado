name: Release

# Triggered by vX.Y.Z tags. Produces:
#   1. Cross-platform binaries (linux/darwin/windows × amd64/arm64) via
#      goreleaser, with checksums.txt and SBOM per-archive.
#   2. Cosign keyless signature over checksums.txt (sig + cert uploaded
#      alongside). Rekor transparency-log entry is implicit with cosign ≥ 2.
#   3. SLSA-L3 build provenance attestation over every released artifact
#      via GitHub-native actions/attest-build-provenance. (Replaced the
#      slsa-framework/slsa-github-generator reusable workflow, which is
#      tag-pinned internally and so was rejected by this repo's
#      sha_pinning_required Actions policy — it never produced provenance.
#      The native action is SHA-pinnable and verifiable with
#      `gh attestation verify <artifact> --repo foobarto/stado`.)
#
# Reproducibility is enforced by -trimpath + -buildvcs=true + pinned
# mod_timestamp in .goreleaser.yaml. A third-party rebuild at the same
# commit sha must produce identical sha256 (see `stado verify`).
on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Least privilege at the top; the release job opts into the writes it
# needs below (Scorecard Token-Permissions).
permissions:
  contents: read

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write      # upload release artifacts
      packages: write      # publish to GHCR (Homebrew tap push comes later)
      id-token: write      # OIDC for cosign keyless + provenance signing
      attestations: write  # write build-provenance attestations
    env:
      # GitHub Actions forbids `secrets.*` in a step-level `if:` (the
      # secrets context is not available there). Job-level env CAN read
      # secrets, so we promote "is the minisign signing key provisioned?"
      # to a plain string here and gate the dormant-until-key steps on
      # `env.HAS_MINISIGN_KEY == 'true'` below. With the secret unset this
      # evaluates to 'false' and the minisign steps skip cleanly — the
      # release builds + publishes exactly as it does today.
      HAS_MINISIGN_KEY: ${{ secrets.STADO_MINISIGN_SECKEY != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.5"
          cache: true

      # Race-validate the release in the release path itself. CI moved the
      # -race suite to push:main (off the PR hot path), and while the tag
      # ruleset requires the post-merge `test` check, a release must never
      # ship a binary with a known data race regardless of tag-push timing
      # or ruleset config — so the suite runs here too, before any artifact
      # is built or signed. A failure aborts the release before publish.
      - name: Build bundled wasm (required to compile the embed package)
        run: bash plugins/bundled/build.sh

      - name: Race-test (release gate)
        run: CGO_ENABLED=1 go test -race ./...

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Cross-repo PAT for publishing the Homebrew formula to
          # foobarto/homebrew-tap. The default GITHUB_TOKEN only has
          # write scope on the current repo, so the tap PR needs a
          # PAT provisioned as HOMEBREW_TAP_TOKEN. .goreleaser.yaml
          # templates skip_upload=true when this secret is unset, so
          # the release still succeeds — just without the tap PR.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Minisign release trust root (the verify pubkey), embedded via the
          # ldflag in .goreleaser.yaml builds[].ldflags. Read with
          # `{{ if index .Env "..." }}` so an unset secret expands to "" here
          # and the template injects the empty default (current behavior:
          # self-update stays disabled). PUBKEY_B64 = base64 of the RAW
          # 32-byte Ed25519 public key. (The signer key-id is not embedded —
          # see the .goreleaser.yaml note; it's display-only + uint64, which
          # `-X` can't set.)
          STADO_MINISIGN_PUBKEY_B64: ${{ secrets.STADO_MINISIGN_PUBKEY_B64 }}

      # Minisign "layer 3": additionally sign checksums.txt with the
      # long-lived release key (cosign keyless above is the always-on
      # layer). DORMANT-UNTIL-KEY: both steps gate on HAS_MINISIGN_KEY
      # (job-level env derived from the secret) and skip cleanly until the
      # operator provisions STADO_MINISIGN_SECKEY — so releases cut before
      # the key ceremony build + publish unchanged, just without a
      # .minisig. Runs after GoReleaser (dist/checksums.txt exists) and
      # before provenance. This is the ONLINE half of option B: the key
      # lives in a CI secret. For a fully-offline ceremony (sign on an
      # airgapped host, upload the .minisig out of band) leave the secret
      # unset and follow SECURITY.md "Signing a release".
      - name: Minisign-sign checksums
        if: ${{ env.HAS_MINISIGN_KEY == 'true' }}
        env:
          STADO_MINISIGN_SECKEY: ${{ secrets.STADO_MINISIGN_SECKEY }}
          STADO_MINISIGN_PASSWORD: ${{ secrets.STADO_MINISIGN_PASSWORD }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          umask 077
          keyfile="$(mktemp)"
          trap 'shred -u "$keyfile" 2>/dev/null || rm -f "$keyfile"' EXIT
          printf '%s' "$STADO_MINISIGN_SECKEY" > "$keyfile"
          # -S sign; -H forces prehashing so the signature is the "ED"
          # (prehashed BLAKE2b) algorithm stado's verifier requires
          # (internal/audit/minisign.go) regardless of the installed
          # minisign's default. Password fed on stdin. Trusted comment is
          # rendered to the verifier on `minisign -V` success.
          printf '%s\n' "$STADO_MINISIGN_PASSWORD" | minisign -S -H \
            -m dist/checksums.txt \
            -s "$keyfile" \
            -t "stado ${REF_NAME} signed"

      - name: Upload checksums.txt.minisig
        if: ${{ env.HAS_MINISIGN_KEY == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release upload "$REF_NAME" dist/checksums.txt.minisig --clobber

      - name: Attest build provenance
        # GitHub-native SLSA-L3 provenance over every released artifact.
        # subject-checksums reads goreleaser's checksums.txt (the same file
        # cosign signs), so one attestation covers all archives + binaries.
        # SHA-pinned to satisfy the repo's sha_pinning_required policy.
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/checksums.txt
