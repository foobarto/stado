name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

# Cancel in-progress CI runs on the same ref when a newer commit
# arrives. Per-ref grouping means a PR getting two pushes in quick
# succession only runs CI once on the latest sha; same for a series
# of main-branch merges. Doesn't affect release.yml — tag-build
# cancellation could leave half-uploaded signed artefacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

# Three tiers: fast PR gate, post-merge validation, release-time build.
#
# Pull requests run only the cheap gates — non-race `go test`, lint,
# govulncheck (plus gitleaks + CodeQL in their own workflows) — so PR
# feedback is fast. `push: main` adds the slow `-race` test (the early race
# signal on main). The 5-way cross-compile `build` matrix runs ONLY on tag
# pushes (`v*`): cross-platform builds are only needed when cutting a version,
# so it runs at release time alongside GoReleaser rather than on every merge.
# Release safety does NOT rely on this workflow gating tag pushes: release.yml
# re-runs the `-race` suite itself before building/signing, and GoReleaser
# cross-compiles every target — so a data race or platform break can never
# reach a published release. NOTE: the tag ruleset must NOT require the
# `build (...)` contexts (the tag push happens before the tag-triggered build
# can run — requiring it would deadlock); it requires `test`/`lint` (present
# on the merge commit from push:main) + CodeQL + gitleaks.
# Accepted trade-off: data races are caught post-merge, and platform-specific
# compile breaks at release time (a broken release attempt), not on the PR.
jobs:
  test:
    # Branches + PRs only. A tag push doesn't re-run test — the tagged commit
    # already ran it on push:main (and the tag ruleset requires that check).
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache: true

      - name: Build bundled wasm (EP-0042 Part B — built from source, not committed)
        run: bash plugins/bundled/build.sh

      - name: Download dependencies
        run: go mod download

      # PRs run the fast non-race suite; push:main runs the full -race
      # suite (the post-merge race gate). -race requires cgo; the build
      # matrix below still validates CGO_ENABLED=0 for every target on
      # push so release binaries stay pure-Go.
      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CGO_ENABLED=1 go test -race ./...
          else
            go test ./...
          fi

      - name: govulncheck
        # Pin a version instead of @latest so the go.sum cache catches
        # the download — otherwise sum.golang.org hiccups fail CI.
        # Retry once on transient network errors.
        run: |
          set -e
          for i in 1 2 3; do
            go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && break
            echo "retry $i: govulncheck install hiccup, sleeping"
            sleep 10
          done
          govulncheck ./...

  lint:
    # Branches + PRs only (same reasoning as test).
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache: true

      - name: Build bundled wasm (EP-0042 Part B — built from source, not committed)
        run: bash plugins/bundled/build.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.11.4
          args: --timeout=5m

  # Tag/release only: the full cross-compile matrix. Cross-platform builds are
  # only needed when cutting a version, so this runs on tag pushes (`v*`), not
  # on every push:main — it runs alongside GoReleaser at release time. It must
  # NOT be a tag-ruleset required check: the tag push happens before this can
  # run, so requiring it would deadlock; GoReleaser is the real release-time
  # build, and a platform break fails the release rather than blocking main.
  build:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache: true

      - name: Build bundled wasm (EP-0042 Part B — built from source, not committed)
        run: bash plugins/bundled/build.sh

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/stado
