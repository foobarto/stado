name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress CI runs on the same ref when a newer commit
# arrives. Per-ref grouping means a PR getting two pushes in quick
# succession only runs CI once on the latest sha; same for a series
# of main-branch merges. Doesn't affect release.yml — tag-build
# cancellation could leave half-uploaded signed artefacts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache: true

      - name: Build bundled wasm (EP-0042 Part B — built from source, not committed)
        run: bash plugins/bundled/build.sh

      - name: Download dependencies
        run: go mod download

      - name: Run tests (CGO enabled for -race)
        # -race requires cgo; the build matrix below still validates
        # CGO_ENABLED=0 for every target so release binaries stay pure-Go.
        run: CGO_ENABLED=1 go test -race -v ./...

      - name: govulncheck
        # Pin a version instead of @latest so the go.sum cache catches
        # the download — otherwise sum.golang.org hiccups fail CI.
        # Retry once on transient network errors.
        run: |
          set -e
          for i in 1 2 3; do
            go install golang.org/x/vuln/cmd/govulncheck@v1.1.4 && break
            echo "retry $i: govulncheck install hiccup, sleeping"
            sleep 10
          done
          govulncheck ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache: true

      - name: Build bundled wasm (EP-0042 Part B — built from source, not committed)
        run: bash plugins/bundled/build.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.11.4
          args: --timeout=5m

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
          cache: true

      - name: Build bundled wasm (EP-0042 Part B — built from source, not committed)
        run: bash plugins/bundled/build.sh

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/stado
