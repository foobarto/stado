name: Validate homepage version

# The homepage is updated in the signed release PR. A post-tag workflow cannot
# safely create that commit: GITHUB_TOKEN-created PRs do not trigger the
# required pull_request checks, and their git commits are unsigned. Validate
# the immutable tagged tree instead of trying to repair it after publication.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to validate (e.g. v0.77.0). Leave blank to use the latest stable release."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: validate docs/index.html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve target tag + date
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            tag="${PUSH_REF#refs/tags/}"
          elif [[ -n "$DISPATCH_TAG" ]]; then
            tag="$DISPATCH_TAG"
          else
            tag="$(gh release list --limit 100 \
              --json tagName,isPrerelease,isDraft \
              --jq 'map(select(.isPrerelease==false and .isDraft==false))[0].tagName // ""')"
          fi

          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            :
          elif [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "::notice::tag $tag is a prerelease; homepage validation skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::error::invalid or missing stable release tag: $tag"
            exit 1
          fi

          date="$(git for-each-ref --format='%(taggerdate:short)' \
            "refs/tags/$tag" 2>/dev/null || true)"
          if [[ ! "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::$tag must be an annotated tag with a release date"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Validate tagged homepage
        if: steps.meta.outputs.skip != 'true'
        env:
          NEW_TAG: ${{ steps.meta.outputs.tag }}
          NEW_DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -euo pipefail
          tagged_page="${RUNNER_TEMP}/tagged-index.html"
          git show "${NEW_TAG}:docs/index.html" > "$tagged_page"
          python3 hack/update-homepage-version.py \
            --check --file "$tagged_page" "$NEW_TAG" "$NEW_DATE"
