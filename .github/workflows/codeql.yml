name: codeql

# GitHub CodeQL static security analysis for Go → results land in the repo's
# code-scanning tab and back the README CodeQL badge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1' # weekly, Monday 07:30 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL analyze (go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload analysis results
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
          build-mode: manual

      # Bundled wasm are built from source (EP-0042 Part B), not committed —
      # the //go:embed needs them present before any go build.
      - name: Build bundled wasm (EP-0042 Part B)
        run: bash plugins/bundled/build.sh

      # Explicit build (matches CI): pure-Go, no cgo, host platform only.
      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:go"
