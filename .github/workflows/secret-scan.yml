name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Skip secret-scan when CI is already running on the same ref —
# avoids redundant scans on a quick push-then-PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans full history on push so changes that try
          # to add a secret AND backdate it via rebase still get
          # caught. PR scans use the diff range only (faster).
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
          # PRs scan only the diff range; pushes scan the full repo
          # snapshot at HEAD.
          GITLEAKS_ENABLE_COMMENTS: false
